[project]
name = "deepcreamy"
version = "0.1.0"
description = "Image inpainting for anime-style artwork"
readme = "README.md"
authors = [
    { name = "m4gnett", email = "39447635+3kanAlpha@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "pyside6>=6.8",
    "torch==2.15.0+cu132",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
windows-build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
indent-width = 2
